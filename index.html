<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEACE STEAK — PEACE ARCADE</title>
<style>
:root{--ink:#111;--muted:#999;--line:#e7e7e7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#181818;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{display:flex;justify-content:center;padding:14px}
.game{width:min(100%,520px);background:#fff;border:1px dashed #222;box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden}
.inner{padding:18px 18px 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-weight:900;letter-spacing:4px;font-size:15px}
.meta{font-size:9px;letter-spacing:1.7px;color:#777;margin-top:6px}
.level{font-weight:900;font-size:32px;line-height:.9}
.hero{text-align:center;margin:30px 0 17px}
.title{display:inline-block;border:1px solid #ddd;padding:11px 16px;font-size:13px;font-weight:900;letter-spacing:2px}
.status{height:17px;margin-top:8px;font-size:10px;letter-spacing:1.4px;color:#888}
.pieces{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-items:center;margin:8px 0 9px}
.piece-slot{height:112px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#fafafa);overflow:visible}
.piece{width:auto;height:108px;max-width:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none;cursor:grab;filter:drop-shadow(0 9px 8px rgba(0,0,0,.14));transition:transform .16s ease,filter .16s ease,opacity .16s ease}
.piece:active{cursor:grabbing}
.piece.selected{transform:scale(1.06);filter:drop-shadow(0 13px 12px rgba(0,0,0,.22))}
.board{position:relative;width:100%;aspect-ratio:1/1;margin:5px auto 15px;background:#fff;overflow:visible}
.peace-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.16;pointer-events:none;user-select:none;transition:opacity .35s ease}
.board.complete .peace-bg{opacity:1}
.board.complete .drop-layer{opacity:0}
.targets{position:absolute;inset:0}
.target{position:absolute;background:transparent;border:0;padding:0;pointer-events:auto}
.t1{left:6.056338%;top:6.478873%;width:40.704225%;height:67.464789%}.t4{left:53.380282%;top:6.760563%;width:40.563380%;height:67.183099%}.t2{left:19.084507%;top:55.563380%;width:27.464789%;height:36.690141%}.t3{left:53.098592%;top:54.859155%;width:27.816901%;height:37.816901%}
.drop-layer{position:absolute;inset:0;pointer-events:none}
.drop-piece{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.drop-piece img{display:block;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 9px 8px rgba(0,0,0,.13))}
.controls{text-align:center}
.start{appearance:none;border:0;background:#111;color:#fff;border-radius:999px;padding:14px 34px;font-weight:900;letter-spacing:1.8px;font-size:12px;cursor:pointer;min-height:48px;box-shadow:0 9px 18px rgba(0,0,0,.18)}
.start:disabled{opacity:.45;cursor:default}
.message{min-height:20px;margin-top:10px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.4px}
.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;border-top:1px solid #eee;padding-top:10px;color:#999;font-size:9px;letter-spacing:1.8px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:#111}
@keyframes snap{0%{transform:scale(.92)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
.snapped{animation:snap .24s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.wrong{animation:shake .22s linear 2}
@media(max-width:420px){
 body{padding:6px}.inner{padding:14px 12px 11px}.brand{font-size:13px}.level{font-size:28px}
 .hero{margin-top:24px}.pieces{gap:6px}.piece-slot{height:94px}.piece{height:92px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.credits{
  position:fixed;inset:0;background:#fff;z-index:100;
  display:flex;align-items:center;justify-content:center;
  text-align:center;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .7s ease;
}
.credits.show{opacity:1;visibility:visible;pointer-events:auto}
.credits-inner{width:min(88vw,520px);padding:40px 24px}
.credits-kicker{font-size:11px;letter-spacing:4px;color:#999;margin-bottom:22px}
.credits-title{font-size:34px;font-weight:900;letter-spacing:5px;margin-bottom:16px}
.credits-line{font-size:12px;letter-spacing:2px;margin:9px 0;color:#222}
.credits-small{font-size:9px;letter-spacing:2px;color:#999;margin-top:35px}
.credits-btn{
  margin-top:38px;border:0;background:#111;color:#fff;border-radius:999px;
  padding:14px 28px;font-weight:900;letter-spacing:2px;cursor:pointer
}

.game-complete #start{visibility:hidden;pointer-events:none;opacity:0}</style>
</head>

const imgs=[...document.querySelectorAll('.piece')];
const targets=[...document.querySelectorAll('.target')];
const board=document.getElementById('board');
const layer=document.getElementById('dropLayer');
const start=document.getElementById('start');
const status=document.getElementById('status');
const msg=document.getElementById('message');
const timer=document.getElementById('timer');
const credits=document.getElementById('credits');
const creditsClose=document.getElementById('creditsClose');
const S={running:false,locked:new Set(),selected:null,drag:null,startTime:0,raf:0,left:45};

imgs.forEach(i=>i.src=A[i.dataset.piece]);

function sound(freq=520,dur=.08,type='sine',vol=.035){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=sound.c||(sound.c=new C);if(c.state==='suspended')c.resume();
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;
  g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.stop(c.currentTime+dur)
 }catch(e){}
}

function reset(){
 S.running=false;S.locked.clear();S.selected=null;S.drag=null;cancelAnimationFrame(S.raf);
 S.left=45;timer.textContent='45.0';status.textContent='READY — 4 PIECES WAITING';
 msg.textContent='';start.disabled=false;start.textContent='START GAME';layer.innerHTML='';
 board.classList.remove('complete');
credits.classList.remove('show');
credits.setAttribute('aria-hidden','true');
 imgs.forEach(i=>{
  i.style.visibility='visible';i.style.position='';i.style.left='';i.style.top='';
  i.style.width='';i.style.height='';i.style.zIndex='';i.removeAttribute('data-drag-w');i.removeAttribute('data-drag-h');i.classList.remove('selected','wrong')
 });
}

function startGame(){
 reset();S.running=true;S.startTime=performance.now();start.disabled=true;start.textContent='GAME RUNNING';
 status.textContent='RESTORE THE PEACE — 45 SECONDS';
 msg.textContent='Ziehe jedes Steak-Stück auf seine halbtransparente Vorlage.';
 sound(620,.09);tick();
}


function fanfare(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const c=sound.c||(sound.c=new C);
    if(c.state==='suspended')c.resume();
    const now=c.currentTime;
    const notes=[
      [523.25,0.00,.16],[659.25,0.14,.16],[783.99,0.28,.18],
      [1046.50,0.46,.26],[783.99,0.73,.12],[1046.50,0.86,.42]
    ];
    notes.forEach(([freq,delay,dur],idx)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type=idx===5?'triangle':'sine';
      o.frequency.value=freq;
      g.gain.setValueAtTime(.0001,now+delay);
      g.gain.exponentialRampToValueAtTime(idx===5?.075:.045,now+delay+.025);
      g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);
      o.connect(g);g.connect(c.destination);
      o.start(now+delay);o.stop(now+delay+dur+.02);
    });
  }catch(e){}
}

function tick(now=performance.now()){
 if(!S.running)return;
 S.left=Math.max(0,45-(now-S.startTime)/1000);timer.textContent=S.left.toFixed(1);
 if(S.left<=0){fail();return}
 S.raf=requestAnimationFrame(tick);
}

function fail(){
 S.running=false;cancelAnimationFrame(S.raf);
 status.textContent='TIME OUT';msg.textContent='PEACE LOST — TRY AGAIN';
 start.disabled=false;start.textContent='RESTART GAME';sound(180,.18,'sawtooth');
}

function point(e){
 const r=board.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top}
}

function nearest(key,x,y){
 const t=targets.find(t=>t.dataset.target===key);
 const r=t.getBoundingClientRect(),b=board.getBoundingClientRect();
 const cx=r.left+r.width/2-b.left,cy=r.top+r.height/2-b.top;
 return{t,d:Math.hypot(x-cx,y-cy),ok:Math.max(48,Math.min(r.width,r.height)*.43)}
}

/* CRITICAL:
   The snapped piece uses the full target rectangle. The source image is cropped to its visible pizza content, so the pizza itself fills the target at 100%. */
function snapPiece(img,t){
 const key=img.dataset.piece;
 if(S.locked.has(key))return;

 S.locked.add(key);
 img.style.visibility='hidden';
 img.classList.remove('selected');

 const r=t.getBoundingClientRect(),b=board.getBoundingClientRect();
 const wrap=document.createElement('div');
 wrap.className='drop-piece snapped';
 wrap.style.left=(r.left-b.left)+'px';
 wrap.style.top=(r.top-b.top)+'px';
 wrap.style.width=r.width+'px';
 wrap.style.height=r.height+'px';

 const placed=document.createElement('img');
 placed.src=A[key];
 placed.alt='';
 wrap.appendChild(placed);
 layer.appendChild(wrap);

 msg.textContent=`${S.locked.size}/4 — ${S.locked.size===4?'PEACE RESTORED':'SNAP!'}`;
 sound(520+S.locked.size*90,.09);

 if(S.locked.size===4){
  S.running=false;
  cancelAnimationFrame(S.raf);
  /* Remove the translucent template completely.
     The four snapped, full-size original pieces remain visible. */
  board.classList.add('complete');
  status.textContent='PEACE RESTORED';
  msg.textContent=`PERFECT. ${(45-S.left).toFixed(1)} SECONDS.`;
  start.disabled=false;
  start.textContent='START GAME';
  /* Let the player admire the fully assembled Peace sign first. */
  setTimeout(()=>{
    fanfare();
    setTimeout(()=>{
      credits.classList.add('show');
      credits.setAttribute('aria-hidden','false');
    },1800);
  },1400);
 }
}

function move(e){
 if(!S.drag||S.drag.img!==e.currentTarget)return;
 S.drag.moved=true;
 S.drag.img.style.left=(e.clientX-55)+'px';
 S.drag.img.style.top=(e.clientY-55)+'px';
}

function end(e){
 if(!S.drag||S.drag.img!==e.currentTarget)return;
 const {img,key}=S.drag;
 const p=point(e),n=nearest(key,p.x,p.y);
 S.drag=null;
 img.releasePointerCapture?.(e.pointerId);
 img.style.position='';img.style.left='';img.style.top='';
 img.style.width='';img.style.height='';img.style.zIndex='';img.removeAttribute('data-drag-w');img.removeAttribute('data-drag-h');
 img.classList.remove('selected');

 if(n.d<=n.ok){
  snapPiece(img,n.t);
 }else{
  img.classList.add('wrong');
  setTimeout(()=>img.classList.remove('wrong'),500);
  msg.textContent='Noch nicht — auf die passende Stelle des Peace-Zeichens ziehen.';
  sound(210,.08,'square',.025);
 }
}

imgs.forEach(img=>{
 img.addEventListener('click',()=>{
  if(!S.running||S.locked.has(img.dataset.piece))return;
  imgs.forEach(x=>x.classList.remove('selected'));
  img.classList.add('selected');
  S.selected=img.dataset.piece;
  msg.textContent='Ausgewählt — jetzt die passende Stelle antippen.';
 });

 img.addEventListener('pointerdown',e=>{
  if(!S.running||S.locked.has(img.dataset.piece))return;
  e.preventDefault();
  S.drag={img,key:img.dataset.piece};
  img.setPointerCapture?.(e.pointerId);
  img.classList.add('selected');
  img.style.position='fixed';
  img.style.zIndex='20';
  const dragH=110;
  const dragW=dragH*(img.naturalWidth/img.naturalHeight);
  img.style.width=dragW+'px';
  img.style.height=dragH+'px';
  img.dataset.dragW=dragW;
  img.dataset.dragH=dragH;
  move(e);
 });
 img.addEventListener('pointermove',move);
 img.addEventListener('pointerup',end);
 img.addEventListener('pointercancel',e=>{
  if(!S.drag)return;
  const i=S.drag.img;S.drag=null;
  i.releasePointerCapture?.(e.pointerId);
  i.style.position='';i.style.left='';i.style.top='';
  i.style.width='';i.style.height='';i.style.zIndex='';
  i.classList.remove('selected');
 });
});

targets.forEach(t=>t.addEventListener('click',()=>{
 if(!S.running||!S.selected||t.dataset.target!==S.selected)return;
 const img=imgs.find(i=>i.dataset.piece===S.selected);
 snapPiece(img,t);
 S.selected=null;
}));

start.addEventListener('click',startGame);
creditsClose.addEventListener('click',()=>{credits.classList.remove('show');credits.setAttribute('aria-hidden','true');reset();});
reset();
})();
</script>
</body>
</html>
